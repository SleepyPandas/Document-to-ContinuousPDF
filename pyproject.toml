[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seamless-pdf"
version = "1.0.1"
authors = [
  { name="Anthony Hua", email="tommyrobotics1@gmail.com" },
]
description = "Convert HTML, Markdown, and DOCX documents into continuous, single-page PDFs."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "playwright >=1.40.0",
    "markdown >=3.10.1",
    "Pygments >=2.17.0",
    "pymdown-extensions >=10.0",
    "mammoth >=1.6.0",
    "pypdf >=3.17.0",
]

[project.scripts]
seamless-pdf = "seamless_pdf.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["seamless_pdf"]

[tool.coverage.report]
show_missing = true
skip_covered = true

